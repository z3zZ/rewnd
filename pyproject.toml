[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewnd"
version = "1.1.0"
description = "Hours of work, rewound in seconds. A free, local webcam timelapse app for Windows and Linux."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PySide6>=6.6",
  "opencv-python>=4.8",
  "numpy>=1.24",
  "Pillow>=10.0",
  "imageio-ffmpeg>=0.4.9",
  "pygrabber>=0.2; sys_platform == 'win32'",
  "tzdata>=2024.1",
  "jeepney>=0.8; sys_platform == 'linux'",
]

[project.gui-scripts]
rewnd = "rewnd.app:main"

[tool.setuptools.packages.find]
include = ["rewnd*"]

[tool.setuptools.package-data]
rewnd = ["assets/fonts/*", "assets/icons/*"]
